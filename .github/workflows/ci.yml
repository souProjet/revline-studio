name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: System dependencies (Tauri v2, ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential ffmpeg

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The frontend build above produces ../out, which tauri-build requires.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The ignored render test needs a hardware encoder (NVENC or VideoToolbox), which hosted runners lack.
      - name: Tests
        working-directory: src-tauri
        run: cargo test --lib
